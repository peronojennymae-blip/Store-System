<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Kiosk POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="kiosk">
        <section id="itemSelectionScreen" class="screen pos-screen">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">Self-Service POS</p>
                    <h1>Choose Your Items</h1>
                </div>
            </header>

            <div class="pos-layout">
                <section class="products-panel" aria-label="Product selection">
                    <h2>Products</h2>
                    <div id="productGrid" class="product-grid"></div>
                </section>

                <aside class="cart-panel" aria-label="Cart">
                    <div class="cart-header">
                        <h2>Your Cart</h2>
                        <span id="cartCount" class="cart-count">0 items</span>
                    </div>

                    <div id="cartItems" class="cart-items">
                        <p class="empty-cart">Tap a product to add it here.</p>
                    </div>

                    <div class="cart-total">
                        <span>Total</span>
                        <strong id="transactionTotal">&#8369;0.00</strong>
                    </div>

                    <button id="summaryButton" class="summary-button">Proceed to Order Summary</button>
                </aside>
            </div>
        </section>

        <section id="orderSummaryScreen" class="screen summary-screen hidden">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">Order Summary</p>
                    <h1>Review Your Order</h1>
                </div>
            </header>

            <div class="summary-panel">
                <div id="summaryItems" class="summary-items"></div>

                <div class="summary-total">
                    <span>Total Amount</span>
                    <strong id="summaryTotal">&#8369;0.00</strong>
                </div>

                <div class="summary-actions">
                    <button id="backToItemsButton" class="back-button">Back</button>
                    <button id="continuePaymentButton" class="summary-button">Continue to Payment</button>
                </div>
            </div>
        </section>

        <section id="paymentScreen" class="screen payment-screen hidden">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">Payment Method</p>
                    <h1>Select Payment</h1>
                </div>
            </header>

            <div class="payment-panel">
                <div class="payment-total">
                    <span>Total Amount</span>
                    <strong id="paymentTotal">&#8369;0.00</strong>
                </div>

                <div class="payment-methods">
                    <button class="payment-button cash-button" type="button">
                        <span class="payment-icon">&#128181;</span>
                        Cash
                    </button>
                    <button class="payment-button qr-button" type="button">
                        <span class="payment-icon">&#9638;</span>
                        QR Payment
                    </button>
                    <button class="payment-button card-button" type="button">
                        <span class="payment-icon">&#128179;</span>
                        Credit/Debit Card
                    </button>
                </div>

                <button id="backToSummaryButton" class="back-button">Back</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
